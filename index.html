
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drama Subtitle Studio</title>
<style>
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;padding:20px}
h1{color:#60a5fa;text-align:center}
p{color:#cbd5e1}
button,.upload{background:#2563eb;color:white;border:0;padding:12px 16px;border-radius:9px;margin:5px;cursor:pointer}
textarea{width:100%;height:55vh;background:#1e293b;color:white;border:1px solid #475569;border-radius:10px;padding:12px;box-sizing:border-box;font-size:16px;line-height:1.6}
input{margin:12px 0}
.panel{background:#1e293b;padding:15px;border-radius:12px;margin-top:15px}
#status{color:#4ade80}
</style>
</head>
<body>
<h1>🎬 Drama Subtitle Studio</h1>
<p style="text-align:center">ឧបករណ៍កែ Subtitle ភាសាខ្មែរ</p>

<div class="panel">
<h3>📂 បញ្ចូលឯកសារ SRT</h3>
<input type="file" id="file" accept=".srt,.txt">
<p id="status">មិនទាន់មានឯកសារ</p>
</div>

<div class="panel">
<h3>✍️ កែអត្ថបទ Subtitle</h3>
<textarea id="editor" placeholder="ដាក់អត្ថបទ SRT របស់អ្នកនៅទីនេះ..."></textarea>
<p id="count">ចំនួន Subtitle: 0</p>
</div>

<div class="panel">
<div class="panel">
  <h3>🇰🇭 បញ្ចូលអត្ថបទបកប្រែខ្មែរ</h3>
  <p>បញ្ចូលអត្ថបទខ្មែរមួយបន្ទាត់ក្នុងមួយ Subtitle តាមលំដាប់</p>
  <textarea id="khmerInput" placeholder="បញ្ចូលអត្ថបទខ្មែរនៅទីនេះ..."></textarea>
  <button onclick="applyKhmer()">🇰🇭 បញ្ចូលទៅក្នុង SRT</button>
</div>

<h3>🛠️ ឧបករណ៍</h3>
<button onclick="downloadSRT()">⬇️ ទាញយក SRT</button>
<button onclick="copyText()">📋 Copy អត្ថបទ</button>
<button onclick="clearText()">🗑️ លុបអត្ថបទ</button>
<button onclick="editor.value=editor.value.replace(/\r\n/g,'\n');updateCount()">កែទម្រង់</button>
</div>

<script>
const editor=document.getElementById('editor');
const file=document.getElementById('file');
const status=document.getElementById('status');
const count=document.getElementById('count');

function updateCount(){
 const blocks=editor.value.trim().split(/\n\s*\n/).filter(x=>x.trim());
 count.textContent='ចំនួន Subtitle: '+blocks.length;
}
editor.addEventListener('input',updateCount);

file.addEventListener('change',e=>{
 const f=e.target.files[0];
 if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
 editor.value=reader.result;
 status.textContent='បានបញ្ចូល: '+f.name;
 updateCount();
 };
 reader.readAsText(f);
});

function downloadSRT(){
 const blob=new Blob([editor.value],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download='subtitle-khmer.srt';
 a.click();
 URL.revokeObjectURL(url);
}
function copyText(){
 navigator.clipboard.writeText(editor.value)
 .then(()=>alert('បាន Copy អត្ថបទហើយ!'))
 .catch(()=>alert('សូមជ្រើសរើស និង Copy អត្ថបទដោយដៃ'));
}
function clearText(){
 if(confirm('តើអ្នកចង់លុបអត្ថបទទាំងអស់មែនទេ?')){
 editor.value='';
 file.value='';
 status.textContent='មិនទាន់មានឯកសារ';
 updateCount();
 }
}
</script>
</body>
</html>
